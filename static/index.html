<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestore Giochi</title>
<style>
:root{--bg:#12141a;--pan:#1b1e27;--pan2:#242836;--bordo:#2f3445;--testo:#e7e9ef;--tenue:#9aa1b5;--acc:#5b8cff;--ok:#3ecf8e;--warn:#f5b84d;--ko:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--testo);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--pan);border-bottom:1px solid var(--bordo);padding:10px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0 10px 0 0}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--tenue);padding:7px 12px;border-radius:7px;cursor:pointer;font-size:14px}
nav button.attivo,nav button:hover{background:var(--pan2);color:var(--testo)}
.badge-n{background:var(--acc);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-left:4px}
.spazio{flex:1}
input,select,textarea{background:var(--pan2);border:1px solid var(--bordo);color:var(--testo);border-radius:7px;padding:7px 10px;font:inherit}
button.b{background:var(--pan2);border:1px solid var(--bordo);color:var(--testo);border-radius:7px;padding:7px 12px;cursor:pointer;font:inherit}
button.b:hover{border-color:var(--acc)}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
button.k{border-color:var(--ko);color:var(--ko)}
button:disabled{opacity:.5;cursor:default}
main{padding:16px 18px 60px}
#corpo{display:flex;align-items:flex-start}
#lato{position:sticky;top:57px;height:calc(100vh - 57px);width:92px;flex:0 0 92px;background:var(--pan);border-right:1px solid var(--bordo);
  display:flex;flex-direction:column;gap:6px;padding:12px 8px;box-sizing:border-box}
#contenuto{flex:1;min-width:0}
#nav{padding:10px 18px 0}
#nav:empty{display:none}
.sez{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;border-radius:10px;border:0;
  background:none;color:var(--tenue);cursor:pointer;font:inherit;font-size:12px}
.sez .ic{font-size:26px;line-height:1}
.sez:hover{background:var(--pan2);color:var(--testo)}
.sez.attivo{background:var(--pan2);color:var(--testo);box-shadow:inset 3px 0 0 var(--acc)}
.sez .badge-n{position:absolute;top:4px;right:6px;margin:0}
.sez.fondo{margin-top:auto}
.filtri{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.tenue{color:var(--tenue)}
.griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:var(--pan);border:1px solid var(--bordo);border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:border-color .15s}
.card:hover{border-color:var(--acc)}
.card.match{border:2px solid var(--ok)}
.card.nomatch{border:2px solid #3d7bff}
.card.forse{border:2px solid var(--warn)}
.card.match:hover,.card.nomatch:hover,.card.forse:hover{filter:brightness(1.12)}
.t.match{color:var(--ok)}.t.nomatch{color:#7aa5ff}.t.forse{color:var(--warn)}
.cop{aspect-ratio:460/215;background:linear-gradient(135deg,#2a3150,#1d2233);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#4b5680;position:relative}
.cop img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.corpo{padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px;flex:1}
.nome{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;gap:5px;flex-wrap:wrap;font-size:12px}
.t{background:var(--pan2);border-radius:5px;padding:1px 6px;color:var(--tenue)}
.t.steam{color:#8fb4ff}.t.inst{color:var(--warn)}.t.rec{color:var(--ok)}.t.ko{color:var(--ko)}
.azioni{display:flex;gap:6px;margin-top:auto;padding-top:6px}
.azioni button{flex:1}
.azioni button.elim{flex:0 0 auto}
.azioni button{white-space:nowrap;padding-left:8px;padding-right:8px}
table{width:100%;border-collapse:collapse}
td,th{padding:7px 8px;border-bottom:1px solid var(--bordo);text-align:left;vertical-align:top}
th{color:var(--tenue);font-weight:500;font-size:12px}
.blocco{background:var(--pan);border:1px solid var(--bordo);border-radius:10px;padding:14px;margin-bottom:14px}
.barra{height:16px;background:var(--pan2);border-radius:8px;overflow:hidden;display:flex}
.barra div{height:100%}
.percorso{font-family:Consolas,monospace;font-size:12px;color:var(--tenue);word-break:break-all}
#progresso{min-width:260px;font-size:12px;color:var(--tenue)}
#progresso .barra{height:6px;margin-top:3px}
#modale{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
#modale .box{background:var(--pan);border:1px solid var(--bordo);border-radius:12px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:18px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--pan2);border:1px solid var(--bordo);padding:10px 16px;border-radius:9px;display:none;z-index:20}
.riga{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.ok{color:var(--ok)}.warn{color:var(--warn)}.ko{color:var(--ko)}
.vuoto{padding:40px;text-align:center;color:var(--tenue)}
.griglia.poster{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.cop.poster{aspect-ratio:2/3}
.cop.poster.mini{width:46px;flex:0 0 46px;font-size:12px}
.chip{background:var(--pan2);border:1px solid var(--bordo);color:var(--tenue);border-radius:16px;padding:4px 11px;cursor:pointer;font:inherit;font-size:13px}
.chip.on{color:var(--testo);border-color:var(--acc)}
.card.st-in_corso{border:2px solid #3d7bff}.card.st-completata{border:2px solid var(--ok)}.card.st-droppata{border:2px solid var(--ko)}
.card.st-in_pausa{border:2px solid var(--warn)}.card.st-da_vedere{border:2px solid var(--bordo)}
.t.st-in_corso,.chip.st-in_corso{color:#7aa5ff}.t.st-completata,.chip.st-completata{color:var(--ok)}.t.st-droppata,.chip.st-droppata{color:var(--ko)}
.t.st-in_pausa,.chip.st-in_pausa{color:var(--warn)}
.risultato{cursor:pointer;padding:6px;border-radius:8px;align-items:flex-start}.risultato:hover{background:var(--pan2)}
</style>
</head>
<body>
<header>
  <h1>🎮 Gestore Giochi</h1>
  <div class="spazio"></div>
  <div id="progresso"></div>
  <button class="b" id="btnScan" onclick="scansiona(false)"></button>
  <button class="b" id="btnEsci" onclick="esci()">⏻</button>
</header>
<div id="corpo">
  <aside id="lato"></aside>
  <div id="contenuto">
    <nav id="nav"></nav>
    <main id="main"></main>
  </div>
</div>
<div id="modale" onclick="if(event.target===this)chiudiModale()"><div class="box" id="mbox"></div></div>
<div id="toast"></div>

<script src="/static/i18n.js"></script>
<script src="/static/media.js"></script>
<script src="/static/telefono.js"></script>
<script>
let D = {giochi:[], dischi:[], doppioni:[], cestini:[], fonti:[]};
let PER_ID = {};
let INSTALLATI = {};
let INSTALLER = {};
// La "controparte" di un installer sono i giochi installati, e viceversa.
const controparte = g => isInst(g) ? INSTALLATI : INSTALLER;
const installatoDi = g => (controparte(g)[g.chiave] || []).filter(x => x.id !== g.id);
// "Forse": nome che inizia come quello della controparte (o viceversa), tipico di DLC/espansioni.
let _simili = {};
function similiDi(g){
  const ck = (isInst(g) ? "i|" : "g|") + g.chiave;
  if (ck in _simili) return _simili[ck];
  const k = g.chiave, r = [], mappa = controparte(g);
  if (k.length >= 6 && !installatoDi(g).length)
    for (const ik in mappa)
      if (ik.length >= 6 && ik !== k && (k.startsWith(ik) || ik.startsWith(k))) r.push(...mappa[ik]);
  return _simili[ck] = r;
}
const statoInst = g => installatoDi(g).length ? "match" : similiDi(g).length ? "forse" : "nomatch";
let vista = "libreria";
const F = {testo:"", disco:"", tipo:"", ord:"nome", voto:""};
let limite = 200;

const isInst = g => g.tipo==="installer" || g.tipo==="archivio";
const nelGruppo = g => /\\_Installer\\/i.test(g.percorso);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const GB = b => b == null ? "?" : b >= 1e12 ? (b/1e12).toFixed(2)+" TB" : b >= 1e9 ? (b/1e9).toFixed(1)+" GB" : (b/1e6).toFixed(0)+" MB";
const tipoTxt = tipo => t("tipo_" + tipo);
const data = ts => new Date(ts*1000).toLocaleString(LOCALE());
const api = async (url, body) => {
  const r = await fetch(url, body === undefined ? {} : {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  return r.json();
};
function toast(msg){const el=document.getElementById("toast");el.textContent=tS(msg);el.style.display="block";clearTimeout(el._h);el._h=setTimeout(()=>el.style.display="none",3500)}
function modale(html){document.getElementById("mbox").innerHTML=html;document.getElementById("modale").style.display="flex"}
function chiudiModale(){document.getElementById("modale").style.display="none"}

const VISTE = ["libreria","recenti","installer","doppioni","spazio","riordina"];        // schede della sezione Giochi
const SEZIONI = [["giochi","🎮"],["serie","📺"],["film","🎬"],["anime","⛩️"]];
let sezione = "giochi";

function disegnaNav(){
  document.getElementById("btnScan").textContent = t("aggiorna");
  document.getElementById("btnScan").style.display = sezione === "giochi" ? "" : "none";
  document.getElementById("btnEsci").title = t("chiudi_app");
  document.documentElement.lang = LINGUA;
  // barra laterale: le quattro sezioni (con quanti titoli sono in corso) + impostazioni in fondo
  const inCorso = c => M.titoli.filter(x => x.categoria === c && x.stato === "in_corso").length;
  document.getElementById("lato").innerHTML = SEZIONI.map(([k, ic]) => {
    const n = k === "giochi" ? 0 : inCorso(k);
    return `<button class="sez ${sezione===k?"attivo":""}" onclick="vaiSezione('${k}')"><span class="ic">${ic}</span>${t("sez_"+k)}${n?`<span class="badge-n">${n}</span>`:""}</button>`;
  }).join("") + `<button class="sez fondo ${sezione==="impostazioni"?"attivo":""}" onclick="vaiSezione('impostazioni')"><span class="ic">⚙️</span>${t("sez_impostazioni")}</button>`;
  // schede in alto: solo nella sezione Giochi
  document.getElementById("nav").innerHTML = sezione !== "giochi" ? "" : VISTE.map(k => {
    let n = k==="libreria" ? D.giochi.filter(g=>!isInst(g)).length : k==="installer" ? D.giochi.filter(isInst).length
          : k==="doppioni" ? D.doppioni.length : k==="recenti" ? D.giochi.filter(g=>g.recente).length : 0;
    return `<button class="${vista===k?"attivo":""}" onclick="vai('${k}')">${t("nav_"+k)}${n?`<span class="badge-n">${n}</span>`:""}</button>`;
  }).join("");
}
function vai(k){vista=k;limite=200;F.tipo="";disegna()}
function vaiSezione(s){sezione=s;limite=200;F.tipo="";FM.stato="";disegna()}
function ricordaPosizione(){
  try { history.replaceState(null, "", "#" + (sezione === "giochi" ? "giochi/" + vista : sezione)); } catch(e) {}
}

async function carica(){
  D = await api("/api/libreria");
  LINGUA = D.lingua || "it";
  PER_ID = Object.fromEntries(D.giochi.map(g => [g.id, g]));
  INSTALLATI = {};
  D.giochi.filter(g => g.steam || g.tipo==="installato").forEach(g => (INSTALLATI[g.chiave] ||= []).push(g));
  INSTALLER = {};
  D.giochi.filter(isInst).forEach(g => (INSTALLER[g.chiave] ||= []).push(g));
  _simili = {};
  disegna();
}

function disegna(){
  disegnaNav();
  ricordaPosizione();
  const m = document.getElementById("main");
  if (sezione === "giochi") {
    m.innerHTML = {libreria:vLibreria, recenti:vRecenti, installer:vInstaller, doppioni:vDoppioni, spazio:vSpazio, riordina:vRiordina}[vista]();
    if (vista==="riordina") caricaRegistro();
  } else {
    m.innerHTML = {serie:vSerie, film:vFilm, anime:vAnime, impostazioni:vImpostazioni}[sezione]();
  }
}

// ------------------------------------------------------------ card
function copertina(g){
  const iniz = esc(g.nome.split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase());
  const img = g.copertina ? `<img loading="lazy" src="https://cdn.akamai.steamstatic.com/steam/apps/${g.copertina}/header.jpg" onerror="this.remove()">` : "";
  return `<div class="cop">${iniz}${img}</div>`;
}
// Cornice secondo il voto: bello = ondulata spessa, sufficiente = ondulata, brutto = dente di sega.
// Il colore resta quello dello stato installer (verde/giallo/blu). Disegnata con border-image (SVG generato).
const COLORI_CORNICE = {match:"#3ecf8e", forse:"#f5b84d", nomatch:"#3d7bff", "":"#6b7287"};
const _cacheBordi = {};
function bordoVoto(voto, colore){
  const k = voto + colore;
  if (_cacheBordi[k]) return _cacheBordi[k];
  const spessa = voto === "bello", onda = voto !== "brutto";
  const w = spessa ? 2.8 : 1.7;
  // punti lungo ogni lato, da 4 a 20 px: il tratto centrale (8-16) contiene esattamente un periodo, così si ripete senza giunture
  const passi = onda ? Array.from({length: 33}, (_, k) => 4 + k * 0.5)
                     : [4, 11.4, 12, 19.4, 20];                       // dente di sega: salita lunga, caduta netta (periodo 8)
  const linea = (f) => passi.map((i, k) => (k ? "L" : "M") + f(i)).join("");
  const sp = i => onda ? 2.2 * Math.sin((i - 4) / 8 * 2 * Math.PI)
                       : (((i - 4) % 8) / 8 * 6.4 - 3.2);             // da -3.2 a +3.2 px, poi giù di colpo
  const d = linea(i => `${i.toFixed(1)},${(4 + sp(i)).toFixed(2)}`) + linea(i => `${i.toFixed(1)},${(20 + sp(i)).toFixed(2)}`)
          + linea(i => `${(4 + sp(i)).toFixed(2)},${i.toFixed(1)}`) + linea(i => `${(20 + sp(i)).toFixed(2)},${i.toFixed(1)}`);
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24'><path d='${d}' fill='none' stroke='${colore}' stroke-width='${w}' stroke-linejoin='round' stroke-linecap='round'/></svg>`;
  const larg = spessa ? 10 : onda ? 7 : 9;
  // URL senza virgolette (sta dentro l'attributo style="..."): apostrofi e parentesi vanno codificati a mano
  const dati = encodeURIComponent(svg).replace(/'/g, "%27").replace(/\(/g, "%28").replace(/\)/g, "%29");
  return _cacheBordi[k] = `border:${larg}px solid transparent;border-image:url(data:image/svg+xml,${dati}) 8 round;`;
}
const ICONA_VOTO = {bello:"👍", sufficiente:"👌", brutto:"👎"};

function card(g){
  const tipo = g.tipo !== "installato" ? tipoTxt(g.tipo) : "";
  const puoGiocare = g.steam || (g.tipo==="installato" && g.exe);
  let cornice = "", etichettaInst = "";
  const dove = l => [...new Set(l.map(x=>x.steam?x.disco+" (Steam)":x.disco))].join(", ");
  const tt = l => esc(l.map(x=>x.percorso).join("\n"));
  if (g.tipo !== "vuoto") {
    cornice = statoInst(g);
    if (cornice==="match") {
      const l = installatoDi(g);
      etichettaInst = isInst(g)
        ? `<span class="t match" title="${tt(l)}">${t("installato_su",{dove:dove(l)})}</span>`
        : `<span class="t match" title="${tt(l)}">${t("installer_su",{dove:dove(l)})}${l.length>1?` (${l.length})`:""}</span>`;
    } else if (cornice==="forse") {
      const s = similiDi(g);
      etichettaInst = isInst(g)
        ? `<span class="t forse" title="${tt(s)}">${t("simile_a",{nome:esc(s[0].nome)})}${s.length>1?` (+${s.length-1})`:""}</span>`
        : `<span class="t forse" title="${tt(s)}">${t("installer_simile",{nome:esc(s[0].nome)})}</span>`;
    } else etichettaInst = `<span class="t nomatch">${t(isInst(g)?"non_installato":"nessun_installer")}</span>`;
  }
  const coloreVoto = g.voto === "brutto" ? "#ff6b6b" : (COLORI_CORNICE[cornice] || COLORI_CORNICE[""]);
  const stileVoto = g.voto ? bordoVoto(g.voto, coloreVoto) : "";
  return `<div class="card ${cornice}" style="${stileVoto}" onclick="dettaglio('${g.id}')">
    ${copertina(g)}
    <div class="corpo">
      <div class="nome" title="${esc(g.nome)}">${esc(g.nome)}</div>
      <div class="meta">
        <span class="t">${g.disco}</span><span class="t">${GB(g.dimensione)}</span>
        ${g.versione?`<span class="t">v${esc(g.versione)}</span>`:""}
        ${g.voto?`<span class="t" title="${t("voto_"+g.voto)}">${ICONA_VOTO[g.voto]} ${t("voto_"+g.voto)}</span>`:""}
        ${g.steam?`<span class="t steam">Steam</span>`:""}
        ${g.recente?`<span class="t rec">${t("recente")}${g.ordine?" #"+g.ordine:""}</span>`:""}
        ${tipo?`<span class="t inst">${tipo}</span>`:""}${etichettaInst}
        ${(g.tag||[]).includes("Demo")?`<span class="t">${t("demo")}</span>`:""}
      </div>
      <div class="azioni">
        ${isInst(g)
          ? `<button class="b" onclick="event.stopPropagation();apri('${g.id}')">${t("apri")}</button>`
          : `<button class="b ${puoGiocare?"p":""}" ${puoGiocare?"":"disabled"} onclick="event.stopPropagation();gioca('${g.id}')">${t("gioca")}</button>
             <button class="b" title="${t("apri_cartella_tt")}" onclick="event.stopPropagation();apri('${g.id}')">📁</button>`}
        <button class="b k elim" title="${t(g.steam?"disinstalla_steam_tt":"elimina_def_tt")}" onclick="event.stopPropagation();eliminaDaCard('${g.id}')">🗑</button>
      </div>
    </div></div>`;
}
function filtra(lista){
  const q = F.testo.toLowerCase();
  let r = lista.filter(g => (!q || g.nome.toLowerCase().includes(q) || g.nome_cartella.toLowerCase().includes(q))
    && (!F.disco || g.disco===F.disco)
    && (!F.voto || (F.voto==="senza" ? !g.voto : g.voto===F.voto))
    && (!F.tipo || (F.tipo==="steam" ? g.steam : F.tipo==="giocabili" ? (g.steam || g.tipo==="installato")
        : F.tipo==="con_gioco" ? statoInst(g)==="match" : F.tipo==="forse" ? statoInst(g)==="forse"
        : F.tipo==="senza_gioco" ? statoInst(g)==="nomatch" : g.tipo===F.tipo)));
  const o = {nome:(a,b)=>a.nome.localeCompare(b.nome), dim:(a,b)=>(b.dimensione||0)-(a.dimensione||0),
             data:(a,b)=>(b.modificato||0)-(a.modificato||0), disco:(a,b)=>a.disco.localeCompare(b.disco)||a.nome.localeCompare(b.nome)};
  return r.sort(o[F.ord]);
}
function opzioni(lista, valore){ return lista.map(([v,k])=>`<option value="${v}" ${valore===v?"selected":""}>${t(k)}</option>`).join(""); }
function barraFiltri(){
  const dischi = [...new Set(D.giochi.map(g=>g.disco))].sort();
  const tipi = vista==="installer"
    ? [["","f_inst_tutti"],["con_gioco","f_inst_con"],["forse","f_inst_forse"],["senza_gioco","f_inst_senza"],["installer","f_inst_cartelle"],["archivio","f_inst_archivi"]]
    : [["","f_tutti"],["giocabili","f_giocabili"],["con_gioco","f_con"],["forse","f_forse"],["senza_gioco","f_senza"],["steam","f_steam"],["sconosciuto","f_senza_exe"],["vuoto","f_vuote"]];
  return `<div class="filtri">
    <input id="cerca" placeholder="${t("cerca")}" value="${esc(F.testo)}" oninput="F.testo=this.value;limite=200;aggiornaGriglia()" style="min-width:240px">
    <select onchange="F.disco=this.value;aggiornaGriglia()"><option value="">${t("tutti_dischi")}</option>${dischi.map(d=>`<option ${F.disco===d?"selected":""}>${d}</option>`).join("")}</select>
    <select onchange="F.tipo=this.value;aggiornaGriglia()">${opzioni(tipi, F.tipo)}</select>
    <select onchange="F.voto=this.value;aggiornaGriglia()">${opzioni([["","f_voto_tutti"],["bello","f_voto_bello"],["sufficiente","f_voto_sufficiente"],["brutto","f_voto_brutto"],["senza","f_voto_senza"]], F.voto)}</select>
    <select onchange="F.ord=this.value;aggiornaGriglia()">${opzioni([["nome","o_nome"],["dim","o_dim"],["data","o_data"],["disco","o_disco"]], F.ord)}</select>
    <span class="tenue" id="conteggio"></span>
    ${vista !== "installer" && daVotare().length ? `<button class="b p" onclick="votaInSequenza()">⭐ ${t("vota_coda", {n: daVotare().length})}</button>` : ""}
  </div>`;
}

// ------------------------------------------------------------ votare in sequenza i giochi senza voto
function daVotare(){
  return D.giochi.filter(g => !g.voto && !isInst(g) && g.tipo !== "vuoto")
    .sort((a, b) => (b.recente - a.recente) || ((b.ordine || 0) - (a.ordine || 0)) || a.nome.localeCompare(b.nome));
}
let CODA = [], posCoda = 0, votatiCoda = 0;
function votaInSequenza(){
  CODA = daVotare(); posCoda = 0; votatiCoda = 0;
  document.addEventListener("keydown", tastiCoda);
  mostraCoda();
}
function mostraCoda(){
  if (posCoda >= CODA.length) {
    modale(`<h2 style="margin-top:0">⭐ ${t("vota_fatto", {n: votatiCoda})}</h2>
      <div class="riga" style="justify-content:flex-end"><button class="b p" onclick="chiudiCoda()">${t("chiudi")}</button></div>`);
    return;
  }
  const g = CODA[posCoda];
  modale(`<div class="tenue">${posCoda + 1} / ${CODA.length} · ${t("vota_votati", {n: votatiCoda})}</div>
    <div class="barra" style="height:5px;margin:6px 0 12px"><div style="width:${posCoda / CODA.length * 100}%;background:var(--acc)"></div></div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center">
      <div style="width:300px">${copertina(g)}</div>
      <div style="flex:1;min-width:220px">
        <h2 style="margin:0 0 6px">${esc(g.nome)}</h2>
        <div class="meta"><span class="t">${g.disco}</span><span class="t">${GB(g.dimensione)}</span>
          ${g.versione ? `<span class="t">v${esc(g.versione)}</span>` : ""}${g.steam ? `<span class="t steam">Steam</span>` : ""}
          ${g.recente ? `<span class="t rec">${t("recente")}${g.ordine ? " #" + g.ordine : ""}</span>` : ""}</div>
        <div class="percorso" style="margin-top:6px">${esc(g.nome_cartella)}</div>
      </div>
    </div>
    <div class="riga" style="margin-top:16px;gap:10px">
      ${["bello","sufficiente","brutto"].map((v, i) => `<button class="b ${v === "brutto" ? "k" : "p"}" style="flex:1;padding:12px;font-size:16px" onclick="votoCoda('${v}')">${ICONA_VOTO[v]} ${t("voto_" + v)} <span class="tenue">(${i + 1})</span></button>`).join("")}
    </div>
    <div class="riga" style="justify-content:space-between">
      <button class="b" ${posCoda ? "" : "disabled"} onclick="posCoda--;mostraCoda()">← ${t("vota_indietro")}</button>
      <span class="tenue">${t("vota_tasti")}</span>
      <button class="b" onclick="posCoda++;mostraCoda()">${t("vota_salta")} →</button>
    </div>
    <div class="riga" style="justify-content:flex-end"><button class="b" onclick="chiudiCoda()">${t("chiudi")}</button></div>`);
}
async function votoCoda(voto){
  const g = CODA[posCoda];
  await api("/api/voto/" + g.id, {voto});
  D.giochi.filter(x => x.chiave === g.chiave).forEach(x => x.voto = voto);   // vale per tutte le copie
  votatiCoda++; posCoda++; mostraCoda();
}
function tastiCoda(e){
  if (document.getElementById("modale").style.display !== "flex" || !CODA.length) return;
  const azione = {"1": "bello", "2": "sufficiente", "3": "brutto"}[e.key];
  if (azione && posCoda < CODA.length) { e.preventDefault(); votoCoda(azione); }
  else if (e.key === "ArrowRight" && posCoda < CODA.length) { posCoda++; mostraCoda(); }
  else if (e.key === "ArrowLeft" && posCoda > 0) { posCoda--; mostraCoda(); }
  else if (e.key === "Escape") chiudiCoda();
}
function chiudiCoda(){
  document.removeEventListener("keydown", tastiCoda);
  CODA = []; chiudiModale(); carica();
}
function griglia(lista){
  if (!lista.length) return `<div class="vuoto">${t("nessun_gioco")} ${D.giochi.length?"":t("premi_aggiorna")}</div>`;
  return `<div class="griglia">${lista.slice(0,limite).map(card).join("")}</div>
    ${lista.length>limite?`<div class="riga" style="justify-content:center"><button class="b" onclick="limite+=300;aggiornaGriglia()">${t("mostra_altri",{n:lista.length-limite})}</button></div>`:""}`;
}
function aggiornaGriglia(){
  const base = vista==="recenti" ? D.giochi.filter(g=>g.recente)
             : vista==="installer" ? D.giochi.filter(isInst)
             : D.giochi.filter(g=>!isInst(g));
  const lista = vista==="recenti" && F.ord==="nome" && !F.testo ? base.filter(g=>!F.disco||g.disco===F.disco).sort((a,b)=>(b.ordine||0)-(a.ordine||0)) : filtra(base);
  document.getElementById("zona").innerHTML = griglia(lista);
  const tot = lista.reduce((s,g)=>s+(g.dimensione||0),0);
  document.getElementById("conteggio").textContent = t("conteggio",{n:lista.length, dim:GB(tot)});
}
function vLibreria(){ setTimeout(aggiornaGriglia); return barraFiltri()+`<div id="zona"></div>`; }
function vRecenti(){
  setTimeout(aggiornaGriglia);
  return `<p class="tenue">${t("recenti_intro")}</p>`+barraFiltri()+`<div id="zona"></div>`;
}

function vInstaller(){
  setTimeout(aggiornaGriglia);
  const inst = D.giochi.filter(isInst);
  const daRaggruppare = inst.filter(g=>!nelGruppo(g));
  const perDisco = {};
  inst.forEach(g => { const d = perDisco[g.disco] ||= {n:0, b:0}; d.n++; d.b += g.dimensione||0; });
  return `<div class="blocco">
    <b>${t("inst_tot",{n:inst.length})}</b> · ${GB(inst.reduce((s,g)=>s+(g.dimensione||0),0))}
    · <span class="ok">${t("inst_con",{n:inst.filter(g=>statoInst(g)==="match").length})}</span>
    · <span class="warn">${t("inst_forse",{n:inst.filter(g=>statoInst(g)==="forse").length})}</span>
    · <span style="color:#7aa5ff">${t("inst_senza",{n:inst.filter(g=>statoInst(g)==="nomatch").length})}</span>
    <span class="tenue"> · ${Object.entries(perDisco).sort().map(([d,x])=>`${d} ${x.n} (${GB(x.b)})`).join(" · ")}</span>
    <div class="riga">
      ${daRaggruppare.length
        ? `<button class="b p" onclick="raggruppaInstaller()">${t("raggruppa_btn",{n:daRaggruppare.length})}</button>
           <span class="tenue">${t("raggruppa_info")}</span>`
        : `<span class="ok">${t("gia_raggruppati")}</span>`}
    </div>
    <div class="riga"><button class="b k" onclick="eliminaInBlocco()">${t("blocco_btn")}</button>
      <span class="tenue">${t("blocco_info")}</span></div>
    </div>` + barraFiltri() + `<div id="zona"></div>`;
}
function eliminaInBlocco(){
  const verdi = D.giochi.filter(g => isInst(g) && statoInst(g)==="match");
  const gialli = D.giochi.filter(g => isInst(g) && statoInst(g)==="forse");
  const tot = l => GB(l.reduce((s,g)=>s+(g.dimensione||0),0));
  const riga = (g, classe) => {
    const rif = classe==="match" ? installatoDi(g) : similiDi(g);
    return `<tr><td><input type="checkbox" class="eb eb-${classe}" value="${g.id}" checked onchange="aggiornaTotaleBlocco()"></td>
      <td>${esc(g.nome_cartella)}<div class="percorso">${esc(g.percorso)}</div></td>
      <td>${GB(g.dimensione)}</td>
      <td class="${classe==="match"?"ok":"warn"}">${t(classe==="match"?"installato_dp":"simile_dp")} ${esc(rif[0]?.nome||"")}<div class="percorso">${esc(rif[0]?.percorso||"")}</div></td></tr>`;
  };
  modale(`<h2 style="margin-top:0">${t("blocco_titolo")}</h2>
    <p class="tenue">${t("blocco_intro")}</p>
    <div class="riga">
      <label><input type="checkbox" checked onchange="document.querySelectorAll('.eb-match').forEach(c=>c.checked=this.checked);aggiornaTotaleBlocco()"> <span class="ok">${t("verdi",{n:verdi.length, dim:tot(verdi)})}</span></label>
      <label><input type="checkbox" checked onchange="document.querySelectorAll('.eb-forse').forEach(c=>c.checked=this.checked);aggiornaTotaleBlocco()"> <span class="warn">${t("gialli",{n:gialli.length, dim:tot(gialli)})}</span></label>
    </div>
    <div style="max-height:45vh;overflow:auto;border:1px solid var(--bordo);border-radius:8px">
      <table>${verdi.map(g=>riga(g,"match")).join("")}${gialli.length?`<tr><th colspan="4" class="warn">${t("gialli_avviso")}</th></tr>`:""}${gialli.map(g=>riga(g,"forse")).join("")}</table>
    </div>
    <p id="totBlocco"></p>
    <div class="riga" style="justify-content:flex-end">
      <button class="b" onclick="chiudiModale()">${t("annulla")}</button>
      <button class="b" onclick="procediBlocco('da_parte')">${t("metti_parte_recup")}</button>
      <button class="b k" onclick="procediBlocco('elimina')">${t("elimina_def_dots")}</button>
    </div>`);
  aggiornaTotaleBlocco();
}
function aggiornaTotaleBlocco(){
  const ids = [...document.querySelectorAll(".eb:checked")].map(c=>c.value);
  const b = ids.reduce((s,id)=>s+(PER_ID[id].dimensione||0),0);
  document.getElementById("totBlocco").innerHTML = t("selezionati",{n:ids.length, dim:GB(b)});
}
function procediBlocco(tipo){
  const ids = [...document.querySelectorAll(".eb:checked")].map(c=>c.value);
  if (!ids.length) return toast(t("nessun_installer_sel"));
  conferma(ids.map(id=>({id, tipo})), t(tipo==="elimina" ? "et_blocco_elimina" : "et_blocco_parte"));
}
function raggruppaInstaller(){
  const ops = D.giochi.filter(g => isInst(g) && !nelGruppo(g) && !g.steam).map(g => {
    const cartella = g.percorso.slice(0, g.percorso.lastIndexOf("\\")) + "\\_Installer";
    return {id:g.id, tipo:"sposta", cartella};
  });
  conferma(ops, t("et_raggruppa"));
}

// ------------------------------------------------------------ azioni gioco
async function gioca(id, exe){const r = await api("/api/avvia/"+id, exe?{exe}:{}); toast(r.messaggio||t("avvio"))}
async function apri(id){await api("/api/apri/"+id, {})}

function nomePulito(g, conVersione=true){
  let n = g.nome + (conVersione && g.versione ? ` v${g.versione}` : "");
  if (g.prefisso) n = g.prefisso + n;                                    // x0235 / L0236 / 0270_: come scritto da te
  else if (g.ordine != null) n = String(g.ordine).padStart(4,"0") + "_" + n;
  return n.replace(/[<>:"/\\|?*]/g,"");
}

  const g = PER_ID[id];
  const copie = D.doppioni.find(d => d.copie.includes(id));
  const altreFonti = D.fonti.filter(f => !g.percorso.toLowerCase().startsWith(f.toLowerCase()+"\\"));
  modale(`
    <div style="display:flex;gap:14px;flex-wrap:wrap">
      <div style="width:260px">${copertina(g)}</div>
      <div style="flex:1;min-width:240px">
        <h2 style="margin:0 0 6px">${esc(g.nome)}</h2>
        <div class="percorso">${esc(g.percorso)}</div>
        <div class="meta" style="margin-top:8px">
          <span class="t">${GB(g.dimensione)}</span>${g.versione?`<span class="t">v${esc(g.versione)}</span>`:""}
          <span class="t">${esc(tipoTxt(g.tipo))}</span>${(g.tag||[]).map(x=>`<span class="t">${esc(x)}</span>`).join("")}
        </div>
        ${g.errore?`<p class="warn">⚠ ${esc(tS(g.errore))}</p>`:""}
        ${copie?`<p class="warn">${t("copie_avviso",{n:copie.copie.length})}</p>`:""}
      </div>
    </div>
    <div class="riga" style="margin-top:14px"><b>${t("voto")}</b>
      ${["bello","sufficiente","brutto"].map(v=>`<button class="b ${g.voto===v?"p":""}" onclick="votaGioco('${id}','${v}')">${ICONA_VOTO[v]} ${t("voto_"+v)}</button>`).join("")}
      ${g.voto?`<button class="b" onclick="votaGioco('${id}',null)">${t("voto_nessuno")}</button>`:""}
      ${g.voto_nome && g.voto===g.voto_nome ? `<span class="tenue">${t("voto_da_nome")}</span>` : ""}</div>
    <div class="riga">
      <button class="b p" ${(g.steam||g.exe)?"":"disabled"} onclick="gioca('${id}')">${t("gioca")}</button>
      <button class="b" onclick="apri('${id}')">${t("apri_cartella")}</button>
    </div>
    ${!g.steam && g.exes && g.exes.length ? `
      <h3>${t("eseguibile")}</h3>
      <div class="riga"><select id="selExe" style="flex:1;min-width:0">
        ${g.exes.map(e=>`<option value="${esc(e)}" ${e===g.exe?"selected":""}>${esc(e.slice(g.percorso.length+1))}</option>`).join("")}
      </select><button class="b" onclick="scegliExe('${id}')">${t("usa_questo")}</button></div>
      <p class="tenue" style="margin:0">${t("exe_info")}</p>` : ""}
    ${g.steam ? `<p class="tenue">${t("steam_info")}</p>
      <div class="riga"><button class="b k" onclick="disinstallaSteam('${id}')">${t("disinstalla_steam")}</button></div>` : `
      <h3>${t("riordina")}</h3>
      <div class="riga"><input id="nuovoNome" value="${esc(nomePulito(g))}" style="flex:1;min-width:200px"><button class="b" onclick="opSingola('${id}','rinomina')">${t("rinomina")}</button></div>
      <div class="riga"><select id="destSposta" style="flex:1;min-width:200px">${altreFonti.map(f=>`<option>${esc(f)}</option>`).join("")}</select><button class="b" onclick="opSingola('${id}','sposta')">${t("sposta")}</button></div>
      <div class="riga"><button class="b k" onclick="opSingola('${id}','da_parte')">${t("metti_parte_dett")}</button>
        <button class="b k" onclick="opSingola('${id}','elimina')">${t("elimina_def")}</button></div>`}
    <div class="riga" style="justify-content:flex-end"><button class="b" onclick="chiudiModale()">${t("chiudi")}</button></div>`);
}
async function votaGioco(id, voto){
  await api("/api/voto/"+id, {voto});
  await carica(); dettaglio(id);
}
async function scegliExe(id){
  await api("/api/scegli_exe/"+id, {exe:document.getElementById("selExe").value});
  toast(t("exe_salvato")); await carica(); dettaglio(id);
}
function opSingola(id, tipo){
  const op = {id, tipo};
  if (tipo==="rinomina") op.nuovo_nome = document.getElementById("nuovoNome").value;
  if (tipo==="sposta") op.cartella = document.getElementById("destSposta").value;
  conferma([op], t("et_"+tipo));
}
function eliminaDaCard(id){
  if (PER_ID[id].steam) return disinstallaSteam(id);
  conferma([{id, tipo:"elimina"}], t("et_elimina_di",{nome:PER_ID[id].nome}));
}
async function disinstallaSteam(id){const r = await api("/api/disinstalla_steam/"+id, {}); toast(r.messaggio)}

// ------------------------------------------------------------ anteprima + esecuzione
async function conferma(ops, etichetta){
  const ant = await api("/api/anteprima", {ops});
  const valide = ant.filter(o=>!o.problema);
  const elimina = valide.some(o=>o.tipo==="elimina");
  const totElim = valide.filter(o=>o.tipo==="elimina").reduce((s,o)=>s+(o.dimensione||0),0);
  const cosa = t(valide.length===1 ? "elemento" : "operazioni");
  modale(`<h2 style="margin-top:0">${t("anteprima",{et:esc(etichetta)})}</h2>
    <p>${t("pronte",{n:valide.length})}${ant.length-valide.length?`, <span class="ko">${t("con_problemi",{n:ant.length-valide.length})}</span>`:""}.</p>
    <table><tr><th></th><th>${t("col_gioco")}</th><th>${t("col_da_a")}</th></tr>
    ${ant.slice(0,300).map(o=>`<tr><td>${o.problema?"❌":o.avviso?"⚠️":"✅"}</td>
      <td>${t("op_"+o.tipo)}<br><b>${esc(o.nome||"")}</b></td>
      <td><div class="percorso">${esc(o.da||"")}</div><div class="percorso">→ ${esc(o.a||"")}</div>
      ${o.problema?`<div class="ko">${esc(tS(o.problema))}</div>`:""}${o.avviso?`<div class="warn">${esc(tS(o.avviso))}</div>`:""}</td></tr>`).join("")}
    </table>
    ${ant.length>300?`<p class="tenue">${t("e_altre",{n:ant.length-300})}</p>`:""}
    ${elimina ? `<div class="blocco" style="border-color:var(--ko)">
        <b class="ko">${t("elim_avviso",{dim:GB(totElim)})}</b>
        <div class="riga">${t("scrivi_elimina")} <input id="confElimina" autocomplete="off" oninput="document.getElementById('btnEsegui').disabled=this.value.trim().toUpperCase()!=='ELIMINA'"></div></div>`
      : `<p class="tenue">${t("annullabili")}</p>`}
    <div class="riga" style="justify-content:flex-end">
      <button class="b" onclick="chiudiModale()">${t("annulla")}</button>
      <button class="b ${elimina?"k":"p"}" ${valide.length&&!elimina?"":"disabled"} id="btnEsegui">${t(elimina?"elimina_n":"esegui_n",{n:valide.length, cosa})}</button>
    </div>`);
  document.getElementById("btnEsegui").onclick = async () => {
    const r = await api("/api/esegui", {ops:valide.map(({id,tipo,nuovo_nome,cartella})=>({id,tipo,nuovo_nome,cartella})), etichetta});
    chiudiModale();
    toast(r.ok ? t("op_avviate") : r.messaggio);
    controllaStato();
  };
}

  return `<div class="blocco">${t("dp_tot",{n:D.doppioni.length, dim:GB(tot)})}<br>
    <span class="tenue">${t("dp_info")}</span>
    <div class="riga"><button class="b p" onclick="mettiDaParteSelezionati()">${t("dp_parte")}</button>
      <button class="b k" onclick="eliminaSelezionati()">${t("dp_elimina")}</button></div></div>

function mettiDaParteSelezionati(){
  const ids = [...document.querySelectorAll(".dp:checked")].map(c=>c.value);
  if (!ids.length) return toast(t("nessuna_copia"));
  conferma(ids.map(id=>({id, tipo:"da_parte"})), t("et_doppioni"));
}
function eliminaSelezionati(){
  const ids = [...document.querySelectorAll(".dp:checked")].map(c=>c.value);
  if (!ids.length) return toast(t("nessuna_copia"));
  conferma(ids.map(id=>({id, tipo:"elimina"})), t("et_elim_doppioni"));

async function svuota(percorso, n){
  const s = prompt(t("svuota_conferma",{n, percorso}));
  if ((s||"").trim().toUpperCase() !== "ELIMINA") return toast(t("annullato"));
  const r = await api("/api/svuota", {percorso}); toast(r.ok ? t("svuotamento") : r.messaggio); controllaStato();
}

}

// ------------------------------------------------------------ stato e scansione
async function scansiona(completa){await api("/api/scansiona",{completa}); controllaStato()}
let polling = null, eraOccupato = false;
async function controllaStato(){
  const s = await api("/api/stato");
  const sc = s.scansione, op = s.operazioni;
  const p = document.getElementById("progresso");
  const occupato = sc.in_corso || op.in_corso;
  document.getElementById("btnScan").disabled = sc.in_corso;
  if (sc.in_corso) {
    const perc = sc.totale ? sc.fatti/sc.totale*100 : 0;
    p.innerHTML = `${esc(tS(sc.fase))} ${sc.fatti}/${sc.totale}<div class="barra"><div style="width:${perc}%;background:var(--acc)"></div></div>`;
    p.title = sc.corrente;
  } else if (op.in_corso) {
    const perc = op.totale ? op.fatti/op.totale*100 : 0;
    p.innerHTML = `${t("op_progresso",{a:op.fatti, b:op.totale})}<div class="barra"><div style="width:${perc}%;background:var(--ok)"></div></div>`;
    p.title = op.corrente;
  } else p.innerHTML = "";
  if (eraOccupato && !occupato) {
    const errori = (op.esito||[]).filter(e=>!e.ok);
    if (errori.length) modale(`<h3>${t("op_fallite")}</h3>${errori.map(e=>`<p><b>${esc(e.nome)}</b>: <span class="ko">${esc(tS(e.errore))}</span></p>`).join("")}<button class="b" onclick="chiudiModale()">OK</button>`);
    await carica();
  } else if (occupato && sc.in_corso && Date.now() - (window._ultimoRicarico||0) > 15000) {
    window._ultimoRicarico = Date.now(); await carica();  // la libreria si riempie mentre scansiona
  }
  eraOccupato = occupato;
  clearTimeout(polling);
  polling = setTimeout(controllaStato, occupato ? 1200 : 5000);
}
